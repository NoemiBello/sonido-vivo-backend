spring.application.name=usuariosservice

server.port=8082

# Base de datos propia: datos personales de los usuarios registrados
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sonidovivo_usuarios?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT: solo se valida (lo emite authservice)
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:sonidovivo-auth}

# Origen del frontend React permitido por CORS
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
