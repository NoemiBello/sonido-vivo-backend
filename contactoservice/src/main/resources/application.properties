# IDENTIFICACION DEL MICROSERVICIO
spring.application.name=contactoservice
server.port=8089

# CONEXION A MYSQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sonidovivo_contacto?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURACION JPA E HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# DOCUMENTACION SWAGGER
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# SEGURIDAD JWT
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:sonidovivo-auth}