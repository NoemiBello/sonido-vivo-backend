spring.application.name=productosservice
server.port=${PORT:8084}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sonidovivo_productos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:sonidovivo-auth}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}
server.error.include-message=never
categorias.url=${CATEGORIAS_URL:http://localhost:8085}
