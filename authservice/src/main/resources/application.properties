spring.application.name=authservice

server.port=8081

# Base de datos propia: solo credenciales (correo, password BCrypt, rol, activo)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sonidovivo_auth?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT: misma clave y emisor en todos los microservicios
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:sonidovivo-auth}
app.jwt.expiration-ms=3600000

# Origen del frontend React permitido por CORS
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
