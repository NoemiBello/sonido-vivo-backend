spring.application.name=pedidosservice

server.port=8087

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sonidovivo_pedidos?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.error.include-message=always

# Seguridad JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=sonidovivo-auth

# Conexion con Productos Service
app.productos.url=${PRODUCTOS_API_URL:http://localhost:8084/api/productos}

# Conexion con Inventario Service
app.inventario.url=${INVENTARIO_API_URL:http://localhost:8086/api/inventario}